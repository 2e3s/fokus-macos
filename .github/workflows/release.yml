name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build macOS app bundle
        run: fokus-macos-build

      - name: Package app bundle
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          archive_name="Fokus-${RELEASE_TAG}-macos-app.zip"
          ditto -c -k --keepParent --sequesterRsrc dist/Fokus.app "$archive_name"
          echo "archive=$archive_name" >> "$GITHUB_OUTPUT"

      - name: Upload packaged app as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fokus-${{ github.event.release.tag_name }}-macos-app
          path: ${{ steps.package.outputs.archive }}

      - name: Publish packaged app to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
