[build-system]
requires = ["setuptools>=68", "pip>=21"]
build-backend = "setuptools.build_meta"

[project]
name = "fokus-macos"
version = "0.1.0"
description = "Standalone macOS menu bar Pomodoro app based on the Fokus KDE plasmoid"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.8",
    "pyobjc-framework-Cocoa>=10,<13; sys_platform == 'darwin'",
]

[project.scripts]
fokus-macos = "fokus_macos.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
fokus_macos = ["icons/*.svg"]

[tool.setuptools.packages.find]
where = ["src"]
